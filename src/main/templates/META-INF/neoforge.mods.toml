modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mixins]]
config="scex_botania_extrabotany_compat.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="SCEX"
description='''Compatibility bridge for Botania 456 and ExtraBotany ${extrabotany_version} on SCEX Legacy Genesis.'''

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="botania"
type="required"
versionRange="[456-SNAPSHOT,457)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="extrabotany"
type="required"
versionRange="[${extrabotany_version}]"
ordering="AFTER"
side="BOTH"
