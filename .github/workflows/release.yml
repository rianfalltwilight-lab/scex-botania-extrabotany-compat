name: Tagged build verification
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify tag, audit, test and build
        shell: pwsh
        run: |
          $version = ((Get-Content gradle.properties | Where-Object { $_ -match '^mod_version=' }) -split '=', 2)[1]
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          ./scripts/verify-public-source.ps1
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: verified-build-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error
