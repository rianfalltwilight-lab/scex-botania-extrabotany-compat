name: Publish prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Audit, test, and build
        shell: pwsh
        run: |
          ./scripts/verify-public-source.ps1
          ./gradlew --no-daemon clean test build
      - name: Prepare release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "${version}" = '1.3.0'
          out='build/public-release'
          mkdir -p "${out}"
          runtime="SCEX-Botania-ExtraBotany-Compat-1.21.1-${version}.jar"
          sources="SCEX-Botania-ExtraBotany-Compat-1.21.1-${version}-sources.jar"
          source_zip="SCEX-Botania-ExtraBotany-Compat-1.21.1-${version}-source.zip"
          cp "build/libs/${runtime}" "${out}/${runtime}"
          cp "build/libs/${sources}" "${out}/${sources}"
          echo 'c593f0ae2328a52136bae925b3460b6db19b4b761e731092ffa11ba88d34d479  '"${out}/${runtime}" | sha256sum -c -
          jar tf "${out}/${runtime}" > "${RUNNER_TEMP}/compat-runtime-entries.txt"
          if grep -q 'testharness' "${RUNNER_TEMP}/compat-runtime-entries.txt"; then
            echo 'Development harness leaked into the runtime JAR.' >&2
            exit 1
          fi
          git archive --format=zip --prefix="scex-botania-extrabotany-compat-${version}/" --output="${out}/${source_zip}" HEAD
          runtime_sha="$(sha256sum "${out}/${runtime}" | cut -d' ' -f1)"
          sources_sha="$(sha256sum "${out}/${sources}" | cut -d' ' -f1)"
          source_sha="$(sha256sum "${out}/${source_zip}" | cut -d' ' -f1)"
          jq -n \
            --arg version "${version}" \
            --arg runtime_sha "${runtime_sha}" \
            --arg sources_sha "${sources_sha}" \
            --arg source_sha "${source_sha}" \
            --arg commit "${GITHUB_SHA}" \
            '{version:$version,status:"unofficial SCEX compatibility preview",minecraft:"1.21.1",neoforge:"21.1.248",botania:"456-20260822.093314-4",extrabotany:"2.0-scex.5-dev",commit:$commit,validation:{unitTests:"2/2",physicalClientAssertions:"7/7",fullPackNewErrors:0},sha256:{runtime:$runtime_sha,sourcesJar:$sources_sha,sourceZip:$source_sha},aiAssisted:true}' \
            > "${out}/SCEX-Botania-ExtraBotany-Compat-${version}-release-manifest.json"
          (cd "${out}" && sha256sum "${runtime}" "${sources}" "${source_zip}" "SCEX-Botania-ExtraBotany-Compat-${version}-release-manifest.json" > "SCEX-Botania-ExtraBotany-Compat-${version}-SHA256SUMS.txt")
      - name: Preserve release bundle
        uses: actions/upload-artifact@v6
        with:
          name: scex-botania-extrabotany-compat-1.3.0-release
          path: build/public-release/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/1.3.0.md'
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" build/public-release/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --prerelease --title 'SCEX Botania / ExtraBotany Compatibility 1.3.0' --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" build/public-release/* --prerelease --title 'SCEX Botania / ExtraBotany Compatibility 1.3.0' --notes-file "${notes}"
          fi
