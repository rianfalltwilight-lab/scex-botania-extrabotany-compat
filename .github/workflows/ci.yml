name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Audit public source
        shell: pwsh
        run: ./scripts/verify-public-source.ps1
      - name: Test and build
        run: ./gradlew --no-daemon clean test build
      - name: Verify runtime excludes development harness
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          runtime="build/libs/SCEX-Botania-ExtraBotany-Compat-1.21.1-${version}.jar"
          test -f "${runtime}"
          echo '2e08769cea672ec16c3c16f2555d91f357b283ef8faf8ec0520e2c241393c891  '"${runtime}" | sha256sum -c -
          jar tf "${runtime}" > "${RUNNER_TEMP}/compat-runtime-entries.txt"
          if grep -q 'testharness' "${RUNNER_TEMP}/compat-runtime-entries.txt"; then
            echo 'Development harness leaked into the runtime JAR.' >&2
            exit 1
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: scex-botania-extrabotany-compat-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
